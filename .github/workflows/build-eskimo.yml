name: Build Eskimo capture package

# Builds the players' package for Eskimo from the released upstream package: the launcher, odx-capture.json (server,
# access key, delivery names), ffmpeg and games\ are taken from it, odx-app.exe and odx.exe are built from this branch
# (capture/dotnet/build-package.ps1). Publishes a GitHub release eskimo-capture-v<version> with the full package and
# the update (the two executables only). The tag does not match capture-v*, so release-capture.yml does not run.
on:
  # A push to eskimo-<version> publishes that version (eskimo-0.2.10 -> eskimo-capture-v0.2.10).
  push:
    branches: ['eskimo-*']
  workflow_dispatch:
    inputs:
      version:
        description: Package version (empty = from the branch name eskimo-<version>)
        default: ''
      base:
        description: Upstream release used as the base package
        default: capture-v0.3.1

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    env:
      INPUT_VERSION: ${{ inputs.version || '' }}
      BASE_TAG: ${{ inputs.base || 'capture-v0.3.1' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Version from the branch
        shell: pwsh
        run: |
          $version = $env:INPUT_VERSION
          if (-not $version) {
            if ($env:GITHUB_REF_NAME -notmatch '^eskimo-(\d+\.\d+\.\d+)$') { throw "branch $env:GITHUB_REF_NAME is not eskimo-<version>" }
            $version = $Matches[1]
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: capture/dotnet/global.json

      # The input mapping and the session checks the delivered files depend on (no ffmpeg needed: video rules skip).
      - name: Unit tests
        shell: pwsh
        run: |
          $filter = 'FullyQualifiedName~SessionBuilderTests|FullyQualifiedName~ValidatorTests.Each_violation_is_caught|' +
                    'FullyQualifiedName~ValidatorTests.Every_error_rule_has_a_mutator|FullyQualifiedName~ValidatorTests.Valid_session_has_no_issues'
          dotnet test capture/dotnet/tests/Odx.Tests --filter $filter
          if ($LASTEXITCODE -ne 0) { throw 'unit tests failed' }

      - name: Download the base package
        shell: pwsh
        run: gh release download $env:BASE_TAG -R trquoccuong/Game-Recorder -p 'odx-capture-*-win-x64.zip' -D base

      - name: Build the package
        shell: pwsh
        run: |
          $base = (Get-ChildItem base -Filter '*.zip' | Select-Object -First 1).FullName
          ./capture/dotnet/build-package.ps1 -Base $base -Version $env:VERSION

      # The package's app must open its window (0.2.10 ended silently after the splash): started from the package, it
      # has to show "Odx Capture" within 90 s; a screenshot of the screen and the app's log are kept as an artifact.
      - name: Smoke test
        shell: pwsh
        run: |
          $pkg = "capture/dotnet/dist/odx-capture-$env:VERSION-win-x64"
          New-Item -ItemType Directory -Force smoke | Out-Null
          $app = Start-Process (Resolve-Path "$pkg/bin/odx-app.exe") -PassThru
          $title = ''
          $deadline = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 3
            $p = Get-Process -Id $app.Id -ErrorAction SilentlyContinue
            if (-not $p) { break }
            $p.Refresh()
            $title = $p.MainWindowTitle
            if ($title -eq 'Odx Capture') { break }
          }
          Start-Sleep -Seconds 5
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $shot = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          [System.Drawing.Graphics]::FromImage($shot).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $shot.Save((Join-Path $PWD 'smoke/screen.png'))
          $log = Get-ChildItem "$pkg/data/logs" -Filter '*.log' -ErrorAction SilentlyContinue | Get-Content -Raw
          if ($log) { $log | Tee-Object -FilePath smoke/odx-app.log }
          $alive = [bool](Get-Process -Id $app.Id -ErrorAction SilentlyContinue)
          if ($alive) { Stop-Process -Id $app.Id -Force }
          if (-not $alive -or $title -ne 'Odx Capture' -or $log -match 'startup failed|unhandled error') {
            throw "odx-app did not open its window (title '$title', running: $alive)"
          }

      - name: Keep the smoke test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: smoke/

      - name: Publish the release
        shell: pwsh
        run: |
          $tag = "eskimo-capture-v$env:VERSION"
          $dist = 'capture/dotnet/dist'
          $notes = @"
          Odx Capture $env:VERSION (Eskimo), built from $env:BASE_TAG with the patch on branch ${{ github.ref_name }} ($env:GITHUB_SHA).

          - odx-capture-$env:VERSION-win-x64.zip: full package, same layout as the official one. Unzip and run "Odx Capture.exe" as administrator.
          - odx-capture-$env:VERSION-update.zip: for a machine with the official package: unzip into its folder and replace (Odx Capture.exe, bin\odx-app.exe, bin\odx.exe only).

          The game launcher stays OdxReforger.exe from the official releases.
          "@
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { gh release delete $tag --yes --cleanup-tag }
          gh release create $tag "$dist/odx-capture-$env:VERSION-win-x64.zip" "$dist/odx-capture-$env:VERSION-update.zip" `
            --target $env:GITHUB_SHA --title "Odx Capture $env:VERSION (Eskimo)" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
